<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="layout">

        <section class="navbar">
            <h3>SYSTEM CONTROL</h3>
        </section>

        <section class="fan-control">
            <h2>FAN CONTROL</h2>
            <div class="fan-items">
                <div class="item fan-item">
                    <img src="assets/fan.png" class="item-img" id="fan-image-1" alt="Fan 1">
                    <h3>Fan 1</h3>
                    <button class="item-submit fan-button" id="fan-button-1">
                        TURN ON
                    </button>
                </div>
                <div class="item fan-item">
                    <img src="assets/fan.png" class="item-img" id="fan-image-2" alt="Fan 2">
                    <h3>Fan 2</h3>
                    <button class="item-submit fan-button" id="fan-button-1">
                        TURN ON
                    </button>
                </div>
            </div>
        </section>

        <section class="bottombar">
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-regular fa-house"></i>
                    </a>
                </li>
                <li>
                    <a href="led.html">
                        <i class="fa-regular fa-lightbulb"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-fan"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-regular fa-circle-user"></i>
                    </a>
                </li>
            </ul>
        </section>

    </div>

    <script src="main.js"></script>
</body>
</html>
