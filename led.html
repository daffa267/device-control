<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="layout">

        <section class="navbar">
            <h3>RUMAH KENDALI</h3>
        </section>

        <section class="led-control">
            <h2>LIGHT CONTROL</h2>

            <div class="led-items">

                <div class="item led-item">
                    <img src="assets/led-off.png" class="item-img" id="led-image-1" alt="Lampu 1">
                    <h3>Light 1</h3>
                    <button class="item-submit led-button" id="led-button-1">
                        TURN ON
                    </button>
                </div>

                <div class="item led-item">
                    <img src="assets/led-off.png" class="item-img" id="led-image-2" alt="Lampu 2">
                    <h3>Light 2</h3>
                    <button class="item-submit led-button" id="led-button-2">
                        TURN ON
                    </button>
                </div>

                <div class="item led-item">
                    <img src="assets/led-off.png" class="item-img" id="led-image-3" alt="Lampu 3">
                    <h3>Light 3</h3>
                    <button class="item-submit led-button" id="led-button-3">
                        TURN ON
                    </button>
                </div>
                <div class="item led-item">
                    <img src="assets/led-off.png" class="item-img" id="led-image-4" alt="Lampu 4">
                    <h3>Light 4</h3>
                    <button class="item-submit led-button" id="led-button-4">
                        TURN ON
                    </button>
                </div>
            </div>
        </section>

        <section class="bottombar">
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-regular fa-house"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-regular fa-lightbulb"></i>
                    </a>
                </li>
                <li>
                    <a href="fan.html">
                        <i class="fa-solid fa-fan"></i>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-regular fa-circle-user"></i>
                    </a>
                </li>
            </ul>
        </section>

    </div>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
